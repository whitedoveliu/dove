<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Dove</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #faf7f2; color: #2a231b;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .box { text-align: center; max-width: 420px; padding: 0 24px; }
  .logo { font-size: 40px; margin-bottom: 18px; }
  .title { font-size: 17px; font-weight: 600; letter-spacing: .01em; }
  .sub { margin-top: 8px; font-size: 13px; color: #7a7267; min-height: 20px; }
  .bar { margin: 22px auto 0; width: 160px; height: 3px; border-radius: 2px; background: #e8dfd0; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #8f5233; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  .err { display: none; margin-top: 18px; padding: 12px 14px; border-radius: 8px;
         background: #fdf1ef; border: 1px solid #f0d5d0; color: #a8443a;
         font-size: 12.5px; text-align: left; white-space: pre-wrap; word-break: break-word; }
  button { display: none; margin-top: 14px; padding: 7px 18px; border-radius: 8px; cursor: pointer;
           border: 1px solid #ded0b8; background: #fbf6eb; color: #2a231b; font-size: 13px; font-family: inherit; }
  button:hover { background: #f5ecdd; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">🕊️</div>
  <div class="title">Dove</div>
  <div class="sub" id="sub">正在启动内核…</div>
  <div class="bar" id="bar"><i></i></div>
  <div class="err" id="err"></div>
  <button id="retry">重试</button>
</div>
<script>
  // 内核由 Tauri 的 setup 钩子在本进程旁边拉起。
  // 页面先渲染这个过渡页，轮询到内核就绪后**原地跳转**到它托管的界面 ——
  // 这样资源路径、CORS、window.location.hostname 全都是对的
  // （直接加载打包好的 dist 会因为绝对路径 /assets/... 在白屏）。
  var PORT = 8790;
  var BASE = 'http://127.0.0.1:' + PORT;
  var started = Date.now();
  var tries = 0;
  var sub = document.getElementById('sub');
  var err = document.getElementById('err');
  var retry = document.getElementById('retry');

  function fail(msg) {
    document.getElementById('bar').style.display = 'none';
    sub.textContent = '启动失败';
    err.style.display = 'block';
    err.textContent = msg;
    retry.style.display = 'inline-block';
  }

  async function probe() {
    tries++;
    try {
      var r = await fetch(BASE + '/api/health', { cache: 'no-store' });
      if (r.ok) {
        var j = await r.json();
        sub.textContent = '就绪 · ' + (j.tools || '?') + ' 个工具';
        // 稍等一下让这行字看得见，然后跳转
        setTimeout(function () { location.replace(BASE + '/'); }, 180);
        return true;
      }
    } catch (e) { /* 还没起来 */ }

    var sec = (Date.now() - started) / 1000;
    if (sec > 5 && sec < 8) sub.textContent = '首次启动会慢一点（要编译 Swift 辅助程序）…';
    if (sec > 20) sub.textContent = '还在等内核…';

    if (sec > 45) {
      fail('内核 45 秒没就绪。\n\n可能原因：\n· 端口 ' + PORT + ' 被占用\n· Node 版本过低（需要 24+）\n· 内核启动报错 —— 在终端里跑下面这条看详情：\n\n  cd <仓库根>/harness\n  node packages/server/src/main.ts');
      return true;
    }
    return false;
  }

  (async function loop() {
    while (true) {
      if (await probe()) return;
      await new Promise(function (r) { setTimeout(r, 500); });
    }
  })();

  retry.addEventListener('click', function () {
    started = Date.now(); tries = 0;
    err.style.display = 'none'; retry.style.display = 'none';
    document.getElementById('bar').style.display = 'block';
    sub.textContent = '正在启动内核…';
    (async function loop2() {
      while (true) { if (await probe()) return; await new Promise(function (r) { setTimeout(r, 500); }); }
    })();
  });
</script>
</body>
</html>
